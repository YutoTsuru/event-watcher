# ハイキュー!! のコラボ情報（仕組みはポケモン用の targets.yaml と同じ）
#
# 通知先の Discord チャンネルを分けるため、Webhook URL は別の環境変数
# （settings.webhook_env）から読み、重複判定の DB も別ファイルにしている。
#
# ※ Discord Webhook URL はここに書かないこと（環境変数を使う）

# 同じ記事を複数のフィードが拾った場合にどの版を残すかは、
# 下の source_priority → 要約の有無 → このフィードの並び順、の順で決まる。
feeds:
  # --- 直接ソース（本物の要約を持つ）---
  # 全ジャンルの記事が流れてくるため、require_any でコラボ関連に絞る。
  - name: GAME Watch
    url: https://game.watch.impress.co.jp/data/rss/1.0/gmw/feed.rdf
    require_any: &collab_keywords
      - コラボ
      - キャンペーン
      - フェア
      - ポップアップ
      - 限定
      - グッズ
      - カフェ
      - 発売
      - 予約
      - プレゼント

  - name: ITmedia
    url: https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
    require_any: *collab_keywords

  - name: PR TIMES
    url: https://prtimes.jp/index.rdf
    require_any: *collab_keywords

  - name: マイナビニュース
    url: https://news.mynavi.jp/rss/index
    require_any: *collab_keywords

  - name: ケータイ Watch
    url: https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf
    require_any: *collab_keywords

  # --- 検索フィード（網羅性と過去 30 日の遡及。ただし要約は持たない）---
  - name: ハイキュー コラボ
    url: https://news.google.com/rss/search?q=%E3%83%8F%E3%82%A4%E3%82%AD%E3%83%A5%E3%83%BC+%E3%82%B3%E3%83%A9%E3%83%9C+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ハイキュー キャンペーン
    url: https://news.google.com/rss/search?q=%E3%83%8F%E3%82%A4%E3%82%AD%E3%83%A5%E3%83%BC+%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%9A%E3%83%BC%E3%83%B3+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ハイキュー ポップアップ
    url: https://news.google.com/rss/search?q=%E3%83%8F%E3%82%A4%E3%82%AD%E3%83%A5%E3%83%BC+%E3%83%9D%E3%83%83%E3%83%97%E3%82%A2%E3%83%83%E3%83%97%E3%82%B9%E3%83%88%E3%82%A2+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ハイキュー カフェ・グッズ
    url: https://news.google.com/rss/search?q=%E3%83%8F%E3%82%A4%E3%82%AD%E3%83%A5%E3%83%BC%E3%82%AB%E3%83%95%E3%82%A7+OR+%E3%83%8F%E3%82%A4%E3%82%AD%E3%83%A5%E3%83%BC%E3%82%B0%E3%83%83%E3%82%BA+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

# 「本当にハイキューの話か」を確かめる安全網。
# 「ハイキュー」は「ハイキュー!!」「ハイキュー‼」にも部分一致する。
targets:
  - name: ハイキュー
    keywords:
      - ハイキュー
      - HAIKYU

# 同じ記事が複数の媒体から届いたとき、どの媒体の版を残すか（targets.yaml と同じ考え方）。
source_priority:
  preferred:
    # 一次情報（公式サイト。Google ニュース上の媒体名は「ハイキュー!!」）
    - ハイキュー!!
    # コラボ情報をまとめて書いている媒体
    - コラボカフェ
    - アニメ！アニメ！
    - PR TIMES
    - ナタリー
    - ファミ通
  deprioritized:
    - Yahoo!ニュース
    - ライブドアニュース
    - Infoseek
    - ニコニコニュース
    - Excite エキサイト
    - gooニュース
    - BIGLOBEニュース
    - dメニューニュース

# 同じ出来事（同じコラボ）を報じた別媒体の記事をまとめる。
# 見出しの特徴語（コラボ相手・商品名などのカタカナ / 漢字 / 英字の連なり）を
# 2 つ以上共有する記事は同じ出来事とみなし、通知した記事から window_days 日の間は
# 同じ出来事の記事を通知しない（保存はする）。
# stopwords には、この話題のどの記事にも出てくる語（キャラクター名など）を書く。
# これらが特徴語に残ると、別のコラボどうしがまとめられてしまう。
# targets のキーワードは自動で除かれるので書かなくてよい。
event_grouping:
  window_days: 7
  stopwords:
    # 登場人物・学校名（複数のコラボで共通して出てくる）
    - 日向
    - 翔陽
    - 影山
    - 飛雄
    - 烏野
    - 音駒
    - 稲荷崎
    - 青葉城西
    - 梟谷
    - 白鳥沢
    - 伊達工
    - バレーボール
    - バレー

settings:
  request_timeout_seconds: 15
  max_notifications_per_run: 500
  max_article_age_days: 3
  max_retry_count: 3
  # ポケモン用とは別の DB にする（重複判定の履歴を混ぜない）
  db_path: data/haikyu.db
  # 通知先チャンネルの Webhook URL を読む環境変数
  webhook_env: DISCORD_WEBHOOK_URL_HAIKYU
