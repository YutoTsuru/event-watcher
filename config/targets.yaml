# 監視設定
#
# feeds   : 収集する RSS/Atom フィード（ここを編集すれば収集元を変更できる）
# targets : 監視対象と、その判定に使うキーワード
# settings: 実行時の挙動
#
# ※ Discord Webhook URL はここに書かないこと（環境変数 DISCORD_WEBHOOK_URL を使う）

# 現在は「ポケモンのコラボ情報」に絞っている。
#
# Google ニュースの検索 RSS を使うと、
#   (1) 検索クエリ自体が「ポケモン × コラボ」の絞り込みとして働く（記事本文まで検索される）
#   (2) when:30d で過去 30 日分まで遡れるので、開催中のコラボも拾える
# という 2 点が効く。通常の新着 RSS（PR TIMES など）は最新数十件しか持たないため、
# 「今やっているコラボ」を洗い出す用途には向かない。
#
# クエリの注意点: 「A B OR C」のように AND と OR を混ぜると 0 件になる。
# OR だけ・AND だけで 1 本のフィードにすること。
#
# 同じ記事を複数のフィードが拾った場合にどの版を残すかは、
# 下の source_priority → 要約の有無 → このフィードの並び順、の順で決まる。
feeds:
  # --- 直接ソース（本物の要約を持つ）---
  # 全ジャンルの記事が流れてくるため、require_any でコラボ関連に絞る。
  - name: GAME Watch
    url: https://game.watch.impress.co.jp/data/rss/1.0/gmw/feed.rdf
    require_any: &collab_keywords
      - コラボ
      - キャンペーン
      - フェア
      - ポップアップ
      - 限定
      - グッズ
      - カフェ
      - 発売
      - 予約
      - プレゼント

  - name: ITmedia
    url: https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
    require_any: *collab_keywords

  - name: PR TIMES
    url: https://prtimes.jp/index.rdf
    require_any: *collab_keywords

  - name: マイナビニュース
    url: https://news.mynavi.jp/rss/index
    require_any: *collab_keywords

  - name: ケータイ Watch
    url: https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf
    require_any: *collab_keywords

  # --- 検索フィード（網羅性と過去 30 日の遡及。ただし要約は持たない）---
  - name: ポケモン コラボ
    url: https://news.google.com/rss/search?q=%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3+%E3%82%B3%E3%83%A9%E3%83%9C+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ポケモン キャンペーン
    url: https://news.google.com/rss/search?q=%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3+%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%9A%E3%83%BC%E3%83%B3+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ポケモン 店舗・カフェ
    url: https://news.google.com/rss/search?q=%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC+OR+%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3%E3%82%AB%E3%83%95%E3%82%A7+OR+%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3%E3%82%B9%E3%83%88%E3%82%A2+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

  - name: ポケモン ポップアップ
    url: https://news.google.com/rss/search?q=%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3+%E3%83%9D%E3%83%83%E3%83%97%E3%82%A2%E3%83%83%E3%83%97%E3%82%B9%E3%83%88%E3%82%A2+when%3A30d&hl=ja&gl=JP&ceid=JP%3Aja

# 同じ記事が複数の媒体から届いたとき、どの媒体の版を残すか。
# 媒体名は Google ニュース経由なら見出し末尾の「 - 媒体名」、直接ソースならフィード名。
# preferred は上ほど優先、deprioritized は他に版があればそちらを残す（転載サイトなど）。
# どちらにも無い媒体はその中間。表記は Discord に届く見出し末尾と完全一致させること。
source_priority:
  preferred:
    # 一次情報（公式）
    - ポケットモンスターオフィシャルサイト
    # 元記事を書いているゲーム・コラボ系メディア
    - GAME Watch
    - コラボカフェ
    - Nintendo DREAM WEB
    - ファミ通
    - 電ファミニコゲーマー
    - インサイド
    - PR TIMES
  deprioritized:
    # 他媒体の記事を転載しているポータル
    - Yahoo!ニュース
    - ライブドアニュース
    - Infoseek
    - ニコニコニュース
    - Excite エキサイト
    - gooニュース
    - BIGLOBEニュース
    - dメニューニュース

# フィード側で「コラボ」の絞り込みは済んでいるので、ここは
# 「本当にポケモンの話か」を確かめる安全網として働かせる。
#
# ここに「コラボ」等を必須キーワードとして足したくなるが、それはやらないこと。
# Google ニュースの RSS はタイトルしか返さず、実際のコラボ記事でも
# タイトルに「コラボ」が入らないもの（例:「サーモス『ポケモン』シリーズ登場」）が
# 4 割ほどあり、それらを取りこぼすため。
targets:
  - name: ポケモン
    keywords:
      - ポケモン
      - ポケットモンスター
      - Pokemon
      - Pokémon
      - ピカチュウ
      - ポケカ

# 同じ出来事（同じコラボ）を報じた別媒体の記事をまとめる。
# 見出しの特徴語（コラボ相手・商品名などのカタカナ / 漢字 / 英字の連なり）を
# 2 つ以上共有する記事は同じ出来事とみなし、通知した記事から window_days 日の間は
# 同じ出来事の記事を通知しない（保存はする）。
# stopwords には、この話題のどの記事にも出てくる語（キャラクター名など）を書く。
# これらが特徴語に残ると、別のコラボどうしがまとめられてしまう。
# targets のキーワードは自動で除かれるので書かなくてよい。
event_grouping:
  window_days: 7
  stopwords:
    - ポケモンセンター
    - センター
    - ポケットモンスター
    - ポケモンカード
    - カードゲーム

settings:
  # 外部 HTTP 通信のタイムアウト（秒）
  request_timeout_seconds: 15
  # 1 回の実行で送る通知の上限。
  # まとめ送信するので 10 件ごとに 1 メッセージ。超えた分は未通知のまま残り、次回以降に送られる。
  max_notifications_per_run: 500
  # 公開からこの日数を過ぎた記事は、保存だけして通知しない（0 以下で無制限）。
  # 検索フィードは when:30d で遡るため、新たに拾った記事でも 2〜3 週間前のものが混ざる。
  # 保存はしておくので、以後同じ記事が流れてきても重複として弾かれる。
  max_article_age_days: 3
  # 通知失敗イベントを再送する最大回数
  max_retry_count: 3
  # SQLite ファイルのパス（リポジトリルートからの相対パス）
  db_path: data/events.db
