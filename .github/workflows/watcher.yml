name: event-watcher

on:
  # 予備の定期実行。本番は cron-job.org からの workflow_dispatch（JST 9:00 / 21:00 ちょうど）。
  # GitHub の定期実行は数時間遅れるので、本番が動いている間は guard ジョブで何もせず終わる
  # （遅れて動いた予備が新着を中途半端な時刻に通知してしまうため）。
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discord へ通知せず収集・保存のみ行う"
        type: boolean
        default: false
      as_backup:
        description: "予備の定期実行と同じ判定を試す（本番が直近で成功していれば何もしない）"
        type: boolean
        default: false

# 同時実行を防ぐ（重複通知・DB 競合の回避）
concurrency:
  group: event-watcher
  cancel-in-progress: false

jobs:
  # 予備の定期実行（schedule）のときだけ、本番が直近で動いているかを確かめる。
  # 本番（workflow_dispatch）が 13 時間以内に成功していれば、watch ジョブを動かさない。
  # 成功していなければ cron-job.org が止まっている（トークン期限切れなど）とみなし、
  # 遅れてでも通知するとともに警告を出す。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check recent cron-job.org trigger
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AS_BACKUP: ${{ inputs.as_backup && 'true' || 'false' }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] && [ "$AS_BACKUP" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$REPO/actions/workflows/watcher.yml/runs?event=workflow_dispatch&status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( 13 * 3600 )) ]; then
            echo "本番の起動（$last UTC）が成功しているため、予備の定期実行は何もしません"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cron-job.org からの起動が 13 時間以上成功していません（最後: ${last:-なし}）。トークンの期限切れや cron-job.org のジョブを確認してください。予備として実行します"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  watch:
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ランナーは毎回破棄されるため、重複判定用の SQLite をキャッシュで引き継ぐ。
      # キャッシュが失効すると再通知が起きうる点は README の「既知の制約」を参照。
      # 話題ごとに DB が別なので、キャッシュも別にする（actions/cache は path が
      # 変わると既存のキャッシュを復元できないため、1 つにまとめないこと）。
      - name: Restore Pokemon database
        uses: actions/cache/restore@v5
        with:
          path: data/events.db
          key: event-watcher-db-${{ github.run_id }}
          restore-keys: |
            event-watcher-db-

      - name: Restore Haikyu database
        uses: actions/cache/restore@v5
        with:
          path: data/haikyu.db
          key: event-watcher-haikyu-db-${{ github.run_id }}
          restore-keys: |
            event-watcher-haikyu-db-

      # --- ポケモンのコラボ情報（config/targets.yaml）---
      - name: Run Pokemon watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m src.main --config config/targets.yaml --log-level INFO \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # --- ハイキューのコラボ情報（config/haikyu.yaml）---
      # ポケモン側が失敗しても実行する。Secret が未登録の間はスキップする。
      - name: Run Haikyu watcher
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL_HAIKYU: ${{ secrets.DISCORD_WEBHOOK_URL_HAIKYU }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL_HAIKYU" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL_HAIKYU が未登録のため、ハイキューの監視をスキップします"
            exit 0
          fi
          python -m src.main --config config/haikyu.yaml --log-level INFO \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save Pokemon database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/events.db
          key: event-watcher-db-${{ github.run_id }}

      - name: Save Haikyu database
        if: ${{ always() && hashFiles('data/haikyu.db') != '' }}
        uses: actions/cache/save@v5
        with:
          path: data/haikyu.db
          key: event-watcher-haikyu-db-${{ github.run_id }}
